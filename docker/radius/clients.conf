# Routeurs autorises a interroger le serveur RADIUS.
#
# La liste vit dans la table "nas" de la base partagee: activer un routeur
# depuis le panneau suffit, sans toucher a ce fichier. Les clients d'exemple
# livres avec FreeRADIUS sont volontairement absents.
#
# Note sur require_message_authenticator: depuis la faille BlastRADIUS,
# FreeRADIUS exige cet attribut par defaut. RouterOS l'envoie depuis la
# version 7.15; pour un routeur plus ancien, declarer ici un bloc client
# dedie avec "require_message_authenticator = no".

client tikras-local {
	ipaddr = 127.0.0.1
	secret = tikras-diagnostic
	shortname = diagnostic
	# Sert uniquement aux verifications lancees depuis le serveur lui-meme.
	require_message_authenticator = no
}
