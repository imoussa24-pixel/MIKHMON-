# Mise en cache des ressources statiques.
#
# Les feuilles de style, scripts et polices etaient renvoyes sans aucune
# consigne de cache: le navigateur les redemandait a chaque page pour
# s'entendre repondre qu'ils n'avaient pas change. Cinq allers-retours par
# page, anodins en local, mais chacun coute environ un tiers de seconde
# depuis le Niger.
#
# Les feuilles portent un numero de version tire de leur date de
# modification (?v=...): une nouvelle version change l'adresse, donc le
# navigateur la recharge immediatement. La duree de conservation peut donc
# etre longue sans risque de servir un fichier perime.

<IfModule mod_expires.c>
  ExpiresActive On

  ExpiresByType text/css                  "access plus 7 days"
  ExpiresByType application/javascript    "access plus 7 days"
  ExpiresByType text/javascript           "access plus 7 days"

  ExpiresByType image/png                 "access plus 30 days"
  ExpiresByType image/jpeg                "access plus 30 days"
  ExpiresByType image/gif                 "access plus 30 days"
  ExpiresByType image/svg+xml             "access plus 30 days"
  ExpiresByType image/x-icon              "access plus 30 days"

  ExpiresByType font/woff                 "access plus 30 days"
  ExpiresByType font/woff2                "access plus 30 days"
  ExpiresByType application/font-woff     "access plus 30 days"
  ExpiresByType application/vnd.ms-fontobject "access plus 30 days"
  ExpiresByType font/ttf                  "access plus 30 days"
</IfModule>

<IfModule mod_headers.c>
  # "public" autorise aussi les caches intermediaires: ces fichiers sont
  # identiques pour tous et ne contiennent aucune donnee personnelle.
  <FilesMatch "\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>

  # Les pages, elles, dependent de la session et des donnees du moment:
  # les mettre en cache montrerait a l'utilisateur des recettes perimees,
  # voire l'ecran d'un autre compte sur un cache partage.
  <FilesMatch "\.php$">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
    Header set Pragma "no-cache"
  </FilesMatch>
</IfModule>
